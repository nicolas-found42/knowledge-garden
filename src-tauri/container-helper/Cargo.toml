[package]
name = "kg-container-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
mailparse = "=0.18.0"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
